<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create category | SpendWise</title>
</head>
<body>
<main>
    <h1>Create category</h1>
    <form th:action="@{/categories}" th:object="${categoryForm}" method="post">
        <div>
            <label for="name">Name</label>
            <input id="name" type="text" th:field="*{name}" maxlength="80" required>
            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" role="alert"></p>
        </div>
        <div>
            <label for="type">Type</label>
            <select id="type" th:field="*{type}" required>
                <option value="">Select a type</option>
                <option th:each="type : ${transactionTypes}"
                        th:value="${type}"
                        th:text="${type}"></option>
            </select>
            <p th:if="${#fields.hasErrors('type')}" th:errors="*{type}" role="alert"></p>
        </div>
        <div>
            <label for="description">Description (optional)</label>
            <textarea id="description" th:field="*{description}" maxlength="255"></textarea>
            <p th:if="${#fields.hasErrors('description')}"
               th:errors="*{description}" role="alert"></p>
        </div>
        <button type="submit">Save category</button>
    </form>
    <p><a th:href="@{/categories}">Back to categories</a></p>
</main>
</body>
</html>
