<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SpendWise</title>
</head>
<body>
    <main>
        <h1>SpendWise</h1>
        <h2>This month's summary</h2>
        <dl>
            <dt>Total Income</dt>
            <dd th:text="${#numbers.formatDecimal(monthlySummary.income, 1, 2)}">0.00</dd>
            <dt>Total Expenses</dt>
            <dd th:text="${#numbers.formatDecimal(monthlySummary.expenses, 1, 2)}">0.00</dd>
            <dt>Balance</dt>
            <dd th:text="${#numbers.formatDecimal(monthlySummary.balance, 1, 2)}">0.00</dd>
        </dl>
        <nav aria-label="Main navigation">
            <ul>
                <li><a th:href="@{/transactions}">Transactions</a></li>
                <li><a th:href="@{/categories}">Categories</a></li>
            </ul>
        </nav>
    </main>
</body>
</html>
