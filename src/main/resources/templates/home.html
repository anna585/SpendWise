<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#173b72">
    <title>Dashboard | SpendWiseAI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <header th:replace="~{fragments/layout :: siteHeader('dashboard')}"></header>
    <main class="page-shell">
        <div class="page-heading">
            <p class="eyebrow">Your finances at a glance</p>
            <h1>Dashboard</h1>
            <p class="page-description">A clear view of your money this month.</p>
        </div>
        <section class="summary-grid" aria-label="This month's financial summary">
            <article class="summary-card summary-card--income">
                <div class="summary-card__top">
                    <dl>
                        <dt>Total Income</dt>
                        <dd th:text="${#numbers.formatDecimal(monthlySummary.income, 1, 'COMMA', 2, 'POINT')}">0.00</dd>
                    </dl>
                    <span class="summary-card__icon" aria-hidden="true">+</span>
                </div>
                <p class="summary-card__period">Money coming in this month</p>
            </article>
            <article class="summary-card summary-card--expense">
                <div class="summary-card__top">
                    <dl>
                        <dt>Total Expenses</dt>
                        <dd th:text="${#numbers.formatDecimal(monthlySummary.expenses, 1, 'COMMA', 2, 'POINT')}">0.00</dd>
                    </dl>
                    <span class="summary-card__icon" aria-hidden="true">−</span>
                </div>
                <p class="summary-card__period">Money going out this month</p>
            </article>
            <article class="summary-card summary-card--balance">
                <div class="summary-card__top">
                    <dl>
                        <dt>Balance</dt>
                        <dd th:text="${#numbers.formatDecimal(monthlySummary.balance, 1, 'COMMA', 2, 'POINT')}">0.00</dd>
                    </dl>
                    <span class="summary-card__icon" aria-hidden="true">=</span>
                </div>
                <p class="summary-card__period">Your net balance this month</p>
            </article>
        </section>
    </main>
</body>
</html>
