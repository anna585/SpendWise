<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete transaction | SpendWiseAI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: siteHeader('transactions')}"></header>
<main class="page-shell">
    <div class="page-heading">
        <p class="eyebrow">Review before removing</p>
        <h1>Delete transaction?</h1>
    </div>
    <section class="content-card form-card">
    <p class="confirmation-copy">Are you sure you want to delete this transaction?</p>
    <dl class="detail-list">
        <dt>Date</dt>
        <dd th:text="${transaction.transactionDate}"></dd>
        <dt>Type</dt>
        <dd th:text="${transaction.type}"></dd>
        <dt>Description</dt>
        <dd th:text="${transaction.description}"></dd>
        <dt>Category</dt>
        <dd th:text="${transaction.category.name}"></dd>
        <dt>Amount</dt>
        <dd th:text="${#numbers.formatDecimal(transaction.amount, 1, 'COMMA', 2, 'POINT')}"></dd>
    </dl>
    <form class="form-actions" th:action="@{/transactions/{id}/delete(id=${transaction.id})}" method="post">
        <button class="button--danger" type="submit">Confirm delete</button>
        <a class="button button--secondary" th:href="@{/transactions}">Cancel</a>
    </form>
    </section>
</main>
</body>
</html>
