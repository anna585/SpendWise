<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Budget not found | SpendWiseAI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: siteHeader('budgets')}"></header>
<main class="page-shell">
    <div class="page-heading">
        <p class="eyebrow">We couldn't find that budget</p>
        <h1>Budget not found</h1>
    </div>
    <section class="content-card">
        <p class="notice notice--error" th:text="${errorMessage}" role="alert">
            The requested budget could not be found.
        </p>
        <a class="button button--secondary" th:href="@{/budgets}">Back to budgets</a>
    </section>
</main>
</body>
</html>
